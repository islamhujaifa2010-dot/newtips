name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config build-essential libffi-dev libssl-dev cmake ninja-build \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            python3-pip python3-venv

      - name: Cache Buildozer and Android SDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Install Buildozer (latest)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install git+https://github.com/kivy/buildozer legacy-cgi setuptools "cython==0.29.34"

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: newtips-apk
          path: bin/*.apk
          if-no-files-found: error
